[package]
name = "rusty-pythia"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rusty_pythia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = { version = "4", default-features = false, features = ["v1"] }
postgres = "0.19"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["net"] }
tokio-util = { version = "0.7", features = ["compat"] }
tiberius = { path = "vendor/tiberius", default-features = false, features = ["rustls", "tds73", "tokio", "chrono"] }
chrono = "0.4"
futures-util = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4", default-features = false, features = ["apple-native-keyring-store"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "4", default-features = false, features = ["windows-native-keyring-store"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "4", default-features = false, features = ["zbus-secret-service-keyring-store"] }

