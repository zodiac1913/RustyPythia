name: Release

on:
  push:
    tags:
      - "20[0-9][0-9].[0-9][0-9].[0-9][0-9].*"

permissions:
  contents: write

jobs:
  publish:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-latest
          - platform: Windows
            runner: windows-latest
          - platform: Linux
            runner: ubuntu-24.04

    steps:
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            wget

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # Tauri needs semver, so tag YYYY.MM.DD.xx becomes YYYY.M.D+xx; the
      # Windows installer and macOS build number turn that back into YYYY.M.D.xx.
      - name: Stamp version from tag
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const tag = process.env.GITHUB_REF_NAME;
            const match = /^(\d{4})\.(\d{2})\.(\d{2})\.(\d+)$/.exec(tag);
            if (!match) throw new Error(`Tag ${tag} is not YYYY.MM.DD.xx`);
            const [year, month, day, attempt] = match.slice(1).map(Number);
            const path = "src-tauri/tauri.conf.json";
            const config = JSON.parse(fs.readFileSync(path, "utf8"));
            config.version = `${year}.${month}.${day}+${attempt}`;
            config.bundle.macOS.bundleVersion = `${year}.${month}.${day}.${attempt}`;
            fs.writeFileSync(path, JSON.stringify(config, null, 2));
            console.log(`Stamped ${config.version} (${config.bundle.macOS.bundleVersion})`);
          '

      - name: Build and publish release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Rusty Pythia ${{ github.ref_name }}
          releaseBody: |
            Installers for macOS (Apple Silicon), Windows, and Linux are attached below.

            macOS: the app is not notarized. If macOS blocks it, open
            System Settings → Privacy & Security → Open Anyway, or run
            `xattr -dr com.apple.quarantine "/Applications/Rusty Pythia.app"`.

            Windows: the installer is unsigned, so SmartScreen may warn on first run.
          releaseDraft: false
          prerelease: false
